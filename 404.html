<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 梦境房间</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #1a1a3e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0d4f7;
            overflow: hidden;
        }
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .container {
            text-align: center; z-index: 1; position: relative;
            animation: fadeIn 1s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .emoji { font-size: 80px; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        h1 { font-size: 80px; margin-bottom: 10px; background: linear-gradient(90deg, #d4a5ff, #f0c4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        h2 { font-size: 24px; font-weight: normal; margin-bottom: 20px; opacity: 0.8; }
        p { font-size: 16px; opacity: 0.6; margin-bottom: 30px; }
        a {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: #fff; text-decoration: none;
            border-radius: 50px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(155, 89, 182, 0.4);
        }
        a:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(155, 89, 182, 0.6); }
        .room-preview {
            margin-top: 40px; font-size: 13px; opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="container">
        <div class="emoji">🌙</div>
        <h1>404</h1>
        <h2>这个房间还在梦里...</h2>
        <p>页面没有找到，但你的专属梦境依然在这里</p>
        <a href="/">← 返回梦境房间</a>
        <div class="room-preview">🎮 用 WASD 移动 · V 键切换视角 · 点击家具互动</div>
    </div>
    <script>
        // 生成星空背景
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = (Math.random() * 3 + 1) + 'px';
            star.style.height = star.style.width;
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
