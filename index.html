<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 我的3D梦幻小屋 - 个人博客</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 加载界面 -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <h2>正在构建梦幻小屋...</h2>
            <p id="loading-tip">准备家具中</p>
        </div>
    </div>

    <!-- 主画布 -->
    <canvas id="room-canvas"></canvas>

    <!-- 控制面板 -->
    <div id="controls">
        <div class="control-hint">
            <span id="view-mode">🎥 第三人称视角</span>
            <span class="hint-text">按 V 切换视角 | 鼠标拖拽旋转 | 点击家具互动</span>
        </div>
        <div class="view-buttons">
            <button id="btn-first-person" class="view-btn">👁️ 第一人称</button>
            <button id="btn-third-person" class="view-btn active">🎬 第三人称</button>
        </div>
        <div class="time-buttons">
            <button id="btn-day" class="time-btn active">☀️ 白天</button>
            <button id="btn-night" class="time-btn">🌙 夜晚</button>
            <button id="btn-dream" class="time-btn">✨ 梦幻</button>
        </div>
    </div>

    <!-- 移动端控制 -->
    <div id="mobile-controls">
        <div id="joystick-container">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
        </div>
        <button id="mobile-interact">👆 互动</button>
    </div>

    <!-- 交互提示 -->
    <div id="interaction-hint" class="hidden">
        <div class="hint-bubble">
            <span id="hint-text">点击互动</span>
        </div>
    </div>

    <!-- 电影幻灯片弹窗容器 -->
    <div id="cinema-overlay" class="hidden">
        <button class="cinema-close">✕</button>
        <div id="cinema-wrapper" class="cinema-wrapper">
            <div id="cinema-content"></div>
        </div>
    </div>

    <!-- Three.js ES Module Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <!-- 主程序 (ES Module) -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
